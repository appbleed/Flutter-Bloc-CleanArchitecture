name: app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  analyzer: 7.4.5
  async: 2.13.0
  auto_route: 10.1.0+1
  build_resolvers: 2.4.4
  cached_network_image: 3.4.1
  cupertino_icons: 1.0.8
  dart_style: 3.1.0
  dartx: 1.2.0
  domain:
    path: ../domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_local_notifications: 19.2.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: 5.9.3
  flutter_svg: 2.1.0
  get_it: 8.0.3
  infinite_scroll_pagination: 5.0.0
  initializer:
    path: ../initializer
  injectable: 2.5.0
  js: ^0.7.0
  resources:
    path: ../resources
  rxdart: 0.28.0
  shared:
    path: ../shared
  tuple: 2.0.2
  vm_service: 15.0.2
dev_dependencies:
  auto_route_generator: 10.2.3
  bloc_test: 10.0.0
  build_runner: 2.4.15
  custom_lint: 0.7.5
  flutter_gen_runner: 5.10.0
  flutter_launcher_icons: 0.14.3
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.6
  flutter_test:
    sdk: flutter
  freezed: 3.0.6
  freezed_annotation: 3.0.0
  injectable_generator: 2.7.0
  logging: 1.3.0
  mocktail: 1.0.4
  nals_lints:
    path: ../nals_lints

# Config generate when build
flutter_gen:
  output: lib/resource/generated
  line_length: 160

  integrations:
    flutter_svg: true
    # flare_flutter: true

  assets:
    enabled: true

  fonts:
    enabled: true
  # colors:
  #   enabled: true
  #   inputs:
  #     - assets/color/colors.xml
flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/
